name: Deploy YAML to EC2 via SSM

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_USER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_USER_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload config files to S3
        run: |
          aws s3 cp prometheus.yml s3://prometheus-config-secoureo-bucket/prometheus.yml
          aws s3 cp alertmanager.yml s3://prometheus-config-secoureo-bucket/alertmanager.yml

      - name: Deploy files via SSM
        run: |
          aws ssm send-command \
            --targets "Key=tag:Name,Values=EC2_prometheus" \
            --document-name "AWS-RunShellScript" \
            --comment "Déploiement fichiers Prometheus & Alertmanager" \
            --parameters 'commands=[
                "sudo aws s3 cp s3://prometheus-config-secoureo-bucket/prometheus.yml /etc/prometheus/prometheus.yml",
                "sudo aws s3 cp s3://prometheus-config-secoureo-bucket/alertmanager.yml /etc/prometheus/alertmanager.yml",
                "sudo chown prometheus:prometheus /etc/prometheus/prometheus.yml",
                "sudo chown prometheus:prometheus /etc/prometheus/alertmanager.yml",
                "sudo systemctl restart prometheus",
                "sudo systemctl restart alertmanager",
                "sudo systemctl is-active --quiet prometheus",
                "sudo systemctl is-active --quiet alertmanager"
              ]'