name: Deploy YAML to EC2 via SSM

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_USER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_USER_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Send deployment command via SSM
        run: |
          aws ssm send-command \
            --targets "Key=tag:Name,Values=EC2_prometheus" \
            --document-name "AWS-RunShellScript" \
            --comment "Déploiement fichiers YAML depuis GitHub Actions" \
            --parameters 'commands=["cp /tmp/workflow/*.yml /etc/prometheus/"]'